name: Build TURBO IPTV APK

# Compile l'APK sans Android Studio : GitHub le fait pour vous.
# Lancé à la main depuis l'onglet "Actions" du dépôt.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download TURBO IPTV sources
        run: |
          set -e
          curl -L "https://user.uploads.dev/file/9f253f461c08a96bfd9ac2de827efd01.zip" -o src.zip
          unzip -q src.zip
          chmod +x turbo-iptv/gradlew

      - name: Build debug APKs (phone + TV)
        run: |
          cd turbo-iptv
          ./gradlew :app:assembleDebug :app-tv:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: turbo-iptv-apks
          path: |
            turbo-iptv/app/build/outputs/apk/debug/*.apk
            turbo-iptv/app-tv/build/outputs/apk/debug/*.apk
